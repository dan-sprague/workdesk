[package]
name = "workdesk"
version = "0.2.0"
edition = "2021"
description = "Work Desk: projects, kanban, timeline and sticky notes, filed by the AI of your choice"

[[bin]]
name = "desk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
dirs = "5"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }

# The desktop window (`desk app` / Work Desk.app) is macOS-only for now.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
rfd = { version = "0.17", default-features = false }
tao = "0.37"
wry = "0.57"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
